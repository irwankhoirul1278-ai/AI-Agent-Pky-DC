<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Odyssey — Inbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase SDK — sama persis pola yang dipakai di inbound.html / outbound.html.
     auth-guard.js yang nyimpen firebaseConfig asli & handle login redirect.
     Taruh file ini di folder project yang SAMA dengan auth-guard.js biar konek otomatis.
     Chat AI-nya manggil Google Gemini API lewat proxy Netlify Function di
     netlify/functions/gemini-proxy.js — API key disimpan aman di server
     (env variable GEMINI_API_KEY), gak pernah ke-expose di browser. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<!-- Chart.js buat fitur "Micro-Charts di dalam Chat" — dipanggil on-demand tiap
     balasan AI nyertain field "chart" di JSON-nya (lihat renderChart() di bawah). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<style>
  :root{
    --bg:#10141A; --panel:#171D26; --panel-2:#1E2530; --line:#2B3341;
    --text:#E7EAEE; --muted:#8B93A1; --amber:#E8A33D; --cyan:#4FD1C5; --red:#E4604D;
    --paper:#F4F1E9; --paper-ink:#23201A; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif;
    height:100vh; overflow:hidden; padding:16px 24px; display:flex; justify-content:center;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:none; width:100%; display:flex; flex-direction:column; height:calc(100vh - 32px);}

  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:14px; flex-wrap:wrap; gap:8px;
  }
  header .title{font-size:20px; font-weight:600; letter-spacing:-.01em;}
  header .title span{color:var(--amber);}
  header .sub{color:var(--muted); font-size:12px; font-family:'IBM Plex Mono',monospace;}

  .topbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:10px 12px; margin-bottom:14px; font-size:13px;
  }
  .topbar label{color:var(--muted); font-size:12px;}
  .topbar input[type=date]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:6px 8px; border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .topbar .stat{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);}
  .topbar .stat b{color:var(--text);}
  .switch{position:relative; width:34px; height:18px; flex:none;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .slider{position:absolute; inset:0; background:#39424F; border-radius:20px; cursor:pointer; transition:.15s;}
  .slider:before{content:""; position:absolute; height:12px; width:12px; left:3px; top:3px; background:var(--text); border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--cyan);}
  .switch input:checked + .slider:before{transform:translateX(16px); background:#0D1A18;}
  .spacer{flex:1;}
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .icon-btn:hover{color:var(--cyan); border-color:var(--cyan);}

  .chat-panel{
    flex:1; display:flex; flex-direction:column; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  #chatLog{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px;}

  .msg{max-width:min(78%, 720px); display:flex; flex-direction:column; gap:6px;}
  .msg.user{align-self:flex-end; align-items:flex-end;}
  .msg.agent{align-self:flex-start; align-items:flex-start;}
  .bubble{padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap;}
  .msg.user .bubble{background:var(--amber); color:#241704; border-bottom-right-radius:4px;}
  .msg.agent .bubble{background:var(--panel-2); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg .who{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}

  .copy-btn{
    align-self:flex-start; display:inline-flex; align-items:center; gap:5px;
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:3px 9px; font-size:11px; cursor:pointer; font-family:inherit;
    transition:.15s;
  }
  .copy-btn:hover{color:var(--cyan); border-color:var(--cyan);}
  .copy-btn.copied{color:var(--cyan); border-color:var(--cyan);}

  .attach-card{
    background:var(--paper); color:var(--paper-ink); border-radius:8px;
    padding:12px 14px; font-size:12px; width:100%; max-width:100%; overflow-x:auto;
  }
  .attach-card table{width:100%; border-collapse:collapse;}
  .attach-card th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    color:#8A8368; padding:4px 6px; border-bottom:1px solid #DDD7C6; white-space:nowrap;
  }
  .attach-card td{padding:5px 6px; border-bottom:1px solid #ECE7D8; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .attach-card tr:last-child td{border-bottom:none;}
  .action-btn{
    background:#2D9C8C; color:#fff; border:none; border-radius:5px;
    padding:3px 8px; font-size:10px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .action-btn:hover{background:#237A70;}
  .action-btn:disabled{background:#B8B29A; cursor:default;}
  .badge{display:inline-block; padding:1px 7px; border-radius:20px; font-size:10px; font-family:'IBM Plex Sans',sans-serif; font-weight:600;}
  .badge-late{background:rgba(228,96,77,.15); color:#C6482F;}
  .badge-early{background:rgba(45,150,140,.15); color:#237A70;}
  .badge-ontime{background:rgba(139,147,161,.2); color:#5B6472;}
  .badge-transit{background:rgba(232,163,61,.18); color:#B4761A;}

  .typing{font-size:12px; color:var(--muted); font-style:italic; padding-left:4px;}
  .typing-dots{display:inline-flex; align-items:center; gap:4px; padding:6px 4px;}
  .typing-dots span{
    width:6px; height:6px; border-radius:50%; background:var(--muted);
    animation:typingBounce 1.2s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1){animation-delay:-0.24s;}
  .typing-dots span:nth-child(2){animation-delay:-0.12s;}
  .typing-dots span:nth-child(3){animation-delay:0s;}
  @keyframes typingBounce{
    0%, 80%, 100%{transform:scale(.6); opacity:.4;}
    40%{transform:scale(1); opacity:1;}
  }

  .chat-input-row{
    display:flex; flex-direction:column; gap:8px; padding:12px; border-top:1px solid var(--line); background:var(--panel);
  }
  .chat-input-inner{display:flex; gap:8px;}
  .chat-input-inner input{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 14px; border-radius:20px; font-size:14px; font-family:inherit;
  }
  .chat-input-inner input:focus{outline:none; border-color:var(--amber);}
  .chat-input-inner button{
    background:var(--amber); color:#241704; border:none; border-radius:20px;
    padding:0 20px; font-weight:600; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .chat-input-inner button:disabled{opacity:.5; cursor:default;}

  .img-preview-row{display:none; flex-direction:column; gap:6px; padding:4px 4px 0;}
  .img-preview-row.show{display:flex;}
  .img-preview-row .thumb-list{display:flex; flex-wrap:wrap; gap:10px;}
  .img-preview-row .thumb-wrap{position:relative; width:52px; height:52px; flex:none;}
  .img-preview-row img{width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block;}
  .img-preview-row .remove-img{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--red); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .img-preview-row .hint{font-size:11px; color:var(--muted);}

  .msg-image{max-width:220px; border-radius:10px; border:1px solid var(--line); display:block; cursor:zoom-in; margin-bottom:4px;}

  /* ===== Drag-and-drop overlay di seluruh chat panel ===== */
  .chat-panel{position:relative;}
  .chat-panel.drag-over{border-color:var(--cyan);}
  .chat-panel.drag-over::after{
    content:"Lepas di sini buat lampirin gambar"; position:absolute; inset:0; z-index:5;
    background:rgba(16,20,26,.85); border:2px dashed var(--cyan); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--cyan);
    pointer-events:none;
  }

  /* ===== Micro-chart di dalam bubble chat ===== */
  .chart-wrap{
    width:100%; max-width:280px; height:220px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:2px;
  }

  /* ===== Quick Action Chips ===== */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding:0 2px 2px;}
  .chip-row::-webkit-scrollbar{height:4px;}
  .chip-row::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .chip{
    flex:none; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:20px; padding:6px 14px; font-size:12px; cursor:pointer; font-family:inherit; white-space:nowrap;
    transition:.15s;
  }
  .chip:hover{border-color:var(--amber); color:var(--amber);}

  details.note-details{margin-top:12px; font-size:12px; color:var(--muted);}
  details.note-details summary{cursor:pointer; color:var(--cyan);}
  details.note-details .inner{padding:10px 2px 2px; line-height:1.6;}
  details.note-details code{background:var(--panel-2); padding:1px 5px; border-radius:4px; font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title" style="font-size:32px;">The <span>Odyssey</span></div>
    </div>
    <div class="sub" id="statusLine" style="display:none;">mode: mock data</div>
  </header>

  <div class="topbar">
    <span class="stat" id="quickStat" style="display:none;"><b>0</b> trip tercatat</span>
    <div class="spacer"></div>
    <label for="modelSelect" style="color:var(--muted); font-size:12px;">Model:</label>
    <select id="modelSelect" class="mono" style="background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:5px 8px; border-radius:6px; font-size:12px;">
      <option value="">Auto (fallback otomatis)</option>
      <option value="gemini-3.6-flash">3.6 Flash</option>
      <option value="antigravity-preview-05-2026">Antigravity</option>
      <option value="gemini-3.1-flash-lite">3.1 Flash Lite</option>
      <option value="gemini-3.5-flash-lite">3.5 Flash Lite</option>
    </select>
    <button class="icon-btn" id="refreshBtn">Refresh Data</button>
    <button class="icon-btn" id="clearChatBtn">Chat Baru</button>
  </div>

  <div class="chat-panel">
    <div id="chatLog"></div>
    <div class="chat-input-row">
      <div class="chip-row" id="chipRow">
        <button class="chip" type="button" data-prompt="Cek unit Late Arrival hari ini">Cek Late Hari Ini</button>
        <button class="chip" type="button" data-prompt="Cek unit Early Arrived hari ini">Cek Early Hari Ini</button>
        <button class="chip" type="button" data-prompt="Generate Report Fulfillment DW hari ini">Generate Report DW</button>
        <button class="chip" type="button" data-prompt="Gimana perbandingan jumlah trip tepat waktu vs telat hari ini?">Tepat Waktu vs Telat</button>
      </div>
      <div class="img-preview-row" id="imgPreviewRow">
        <div class="thumb-list" id="thumbList"></div>
        <span class="hint">Gambar siap dikirim (bisa lebih dari 1, atau drag & drop ke panel chat) — tambahin pertanyaan (opsional) lalu Kirim</span>
      </div>
      <div class="chat-input-inner">
        <input id="chatInput" type="text" placeholder='Tanya Odyssey... '>
        <button id="sendBtn">Kirim</button>
      </div>
    </div>
  </div>

</div>

<script src="auth-guard.js"></script>
<script>
const FB_ROOT = "prDcInboundTracking";
const LH_PATH = FB_ROOT + "/lhTracking";

// Label singkat buat ditampilin di UI — sengaja gak pake kata "Gemini" biar
// ringkas, harus tetep sinkron sama value <option> di dropdown #modelSelect
// dan sama GEMINI_MODEL_CHAIN di gemini-proxy.js.
const MODEL_LABELS = {
  "gemini-3.6-flash": "3.6 Flash",
  "antigravity-preview-05-2026": "Antigravity",
  "gemini-3.1-flash-lite": "3.1 Flash Lite",
  "gemini-3.5-flash-lite": "3.5 Flash Lite"
};

let currentTrips = [];
let chatHistory = []; // {role:'user'|'assistant', content:'...'}
let firebaseReady = false;

// ===== Mock data (dipakai kalau live toggle mati / firebase belum siap) =====
function generateMockData(dateStr){
  const base = dateStr || new Date().toISOString().slice(0,10);
  function iso(h,m){ return base + "T" + String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":00"; }
  return [
    { tripNum:"LH-2201", routeName:"Banjarmasin - Palangka Raya", vendorName:"PT Trans Kalimantan", driver:"Sujono", vehicleType:"Fuso", vehiclePlate:"DA 8812 XZ", qtyParcelVal:640, stdOrigin:iso(0,0), staDest:iso(6,30), atdOrigin:iso(0,10), ataDest:iso(5,20) },
    { tripNum:"LH-2202", routeName:"Sampit - Palangka Raya", vendorName:"CV Borneo Cargo", driver:"Herman", vehicleType:"CDD", vehiclePlate:"DA 4471 QA", qtyParcelVal:410, stdOrigin:iso(1,0), staDest:iso(7,30), atdOrigin:iso(1,20), ataDest:iso(8,5) },
    { tripNum:"LH-2203", routeName:"Kuala Kapuas - Palangka Raya", vendorName:"PT Trans Kalimantan", driver:"Andi", vehicleType:"Fuso", vehiclePlate:"DA 5510 LP", qtyParcelVal:290, stdOrigin:iso(2,0), staDest:iso(8,0), atdOrigin:iso(2,15), ataDest:iso(8,10) },
    { tripNum:"LH-2204", routeName:"Pangkalan Bun - Palangka Raya", vendorName:"CV Borneo Cargo", driver:"Rudi", vehicleType:"Fuso", vehiclePlate:"DA 3390 WK", qtyParcelVal:520, stdOrigin:iso(3,0), staDest:iso(9,30), atdOrigin:iso(3,30), ataDest:null },
    { tripNum:"LH-2205", routeName:"Banjarmasin - Palangka Raya", vendorName:"PT Trans Kalimantan", driver:"Yanto", vehicleType:"CDD", vehiclePlate:"DA 7701 YD", qtyParcelVal:355, stdOrigin:iso(4,0), staDest:iso(10,30), atdOrigin:iso(4,5), ataDest:iso(9,50) }
  ];
}

// ===== Firebase live fetch =====
function fetchLiveTrips(){
  return new Promise((resolve, reject) => {
    if (!window.firebase || !firebase.apps || !firebase.apps.length){
      reject(new Error("Firebase belum ke-init (auth-guard.js gak ketemu / belum login)"));
      return;
    }
    if (!firebase.auth().currentUser){
      reject(new Error("Belum login — buka file ini lewat app shell / login dulu"));
      return;
    }
    const db = firebase.database();
    db.ref(LH_PATH).once("value")
      .then(snap => {
        const val = snap.val() || {};
        // Simpen key Firebase asli (_fbKey) di tiap trip — SEBELUMNYA dibuang
        // begitu aja (cuma val[k]), padahal ini WAJIB ada buat nulis balik ke
        // record yang BENER pas fitur "Set Tiba" dipake (kalau salah sasaran
        // bisa nimpa data trip lain).
        resolve(Object.keys(val).map(k => Object.assign({ _fbKey: k }, val[k])));
      })
      .catch(reject);
  });
}

// ===== Replikasi persis logic status di inbound.html =====
function computeStatus(t){
  const atdOrigin = t.atdOrigin ? new Date(t.atdOrigin) : null;
  const ataDest = t.ataDest ? new Date(t.ataDest) : null;
  const now = new Date();
  let statusText = "-";
  let etaDateObj = atdOrigin ? new Date(atdOrigin.getTime() + 390*60*1000) : null; // ETA = atdOrigin + 6.5 jam

  if (atdOrigin){
    if (ataDest){
      const durationHours = (ataDest.getTime() - atdOrigin.getTime()) / 3600000;
      if (durationHours < 6.0) statusText = "Early Arrived";
      else if (durationHours <= 6.5) statusText = "On Time";
      else statusText = "Late Arrival";
    } else {
      statusText = (etaDateObj && now > etaDateObj) ? "Late Arrival" : "In Transit";
    }
  }
  return { statusText, etaDateObj };
}

// Format tanggal pakai KOMPONEN WAKTU LOKAL (WIB) — SAMA PERSIS kayak
// formatDateYYYYMMDD() di inbound.html. JANGAN pakai .toISOString().slice(0,10)
// buat ambil tanggal, karena toISOString() itu UTC: trip yang ATD Origin-nya
// jam 00:00-06:59 pagi WIB bakal "mundur" ke tanggal UTC sebelumnya (H-1),
// jadi gak match sama kolom "Tanggal" di dashboard Inbound yang pakai local time.
// Ini yang bikin AI Agent salah nyortir trip pas ditanya "hari ini".
function formatDateYYYYMMDDLocal(d){
  const pad = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}

function normalizeTrip(t){
  const { statusText, etaDateObj } = computeStatus(t);
  const dateSourceRaw = t.atdOrigin || t.stdOrigin;
  const dateSource = dateSourceRaw ? new Date(dateSourceRaw) : null;
  return {
    // _fbKey: key asli node Firebase (null di mock data) — dipake INTERNAL
    // doang buat target update "Set Tiba", SENGAJA gak dikirim ke prompt AI
    // (di-strip pas bikin dump JSON, lihat tripsForPrompt di askAgent).
    _fbKey: t._fbKey || null,
    tripNum: t.tripNum || "-",
    routeName: t.routeName || "-",
    vendorName: t.vendorName || "-",
    driver: t.driver || "-",
    vehiclePlate: t.vehiclePlate || "-",
    vehicleType: t.vehicleType || "-",
    qtyParcelVal: t.qtyParcelVal || 0,
    stdOrigin: t.stdOrigin || null,
    staDest: t.staDest || null,
    atdOrigin: t.atdOrigin || null,
    ataDest: t.ataDest || null,
    etaDest: etaDateObj ? etaDateObj.toISOString() : null,
    tanggal: dateSource && !isNaN(dateSource) ? formatDateYYYYMMDDLocal(dateSource) : null,
    status: statusText
  };
}

async function loadData(){
  // Auto: kalau session login (auth-guard.js) udah kevalidasi, langsung sync live
  // dari Firebase. Kalau belum login / firebase belum siap, fallback ke data contoh.
  const isLive = firebaseReady;
  document.getElementById("statusLine").textContent = "mode: " + (isLive?"live firebase":"mock data") + " — memuat...";
  try{
    const raw = isLive ? await fetchLiveTrips() : generateMockData();
    // Semua tanggal ditampung tanpa difilter — AI Agent yang nyortir sendiri
    // berdasarkan field "tanggal" tiap trip waktu ada pertanyaan soal tanggal tertentu.
    currentTrips = raw.map(normalizeTrip);
    document.getElementById("quickStat").innerHTML = "<b>"+currentTrips.length+"</b> trip tercatat";
    document.getElementById("statusLine").textContent = "mode: " + (isLive?"live firebase":"mock data");
  }catch(e){
    console.error(e);
    document.getElementById("statusLine").textContent = "gagal ambil data live: " + e.message;
  }
}

function fmtTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "-";
  return d.toTimeString().slice(0,5);
}

function badgeClassFor(status){
  if (status === "Late Arrival") return "badge-late";
  if (status === "Early Arrived") return "badge-early";
  if (status === "In Transit") return "badge-transit";
  return "badge-ontime";
}

// Escape dasar buat nilai yang ditaruh di ATRIBUT HTML (data-trip) — tripNum
// dari AI TETEP mesti dianggap "gak dipercaya penuh" walau harusnya cuma
// nyalin dari data, biar gak ada celah HTML/attribute break.
function escapeHtmlAttr(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderAttachCard(units){
  if (!units || units.length === 0) return "";
  let rows = units.map(u => {
    // Tombol "Set Tiba" CUMA muncul buat unit yang statusnya "In Transit" —
    // status lain (udah final/Late/Early/On Time) gak relevan buat ditandain
    // "baru tiba" lagi.
    const actionCell = u.status === "In Transit"
      ? `<button type="button" class="action-btn set-arrived-btn" data-trip="${escapeHtmlAttr(u.tripNum)}">Set Tiba</button>`
      : "-";
    return `<tr>
      <td>${u.tripNum||"-"}</td>
      <td>${u.vehiclePlate||"-"}</td>
      <td>${u.vendorName||"-"}</td>
      <td>${u.atdOrigin?fmtTime(u.atdOrigin):"-"}</td>
      <td>${u.ataDest?fmtTime(u.ataDest):"-"}</td>
      <td><span class="badge ${badgeClassFor(u.status)}">${u.status||"-"}</span></td>
      <td>${actionCell}</td>
    </tr>`;
  }).join("");
  return `<div class="attach-card"><table>
    <thead><tr><th>Trip</th><th>No Truk</th><th>Vendor</th><th>Berangkat</th><th>Tiba</th><th>Status</th><th>Aksi</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ===== Interactive Report Table: "Set Tiba" =====
// Klik tombol → cari trip aslinya di currentTrips (SUMBER KEBENARAN, bukan
// dari attachUnits yang dikasih AI — AI cuma nyalin data buat ditampilin,
// tapi target update Firebase HARUS dari data asli biar _fbKey-nya valid &
// gak keliru sasaran).
function handleSetArrivedClick(btn){
  const tripNum = btn.dataset.trip;
  const trip = currentTrips.find(t => t.tripNum === tripNum);
  if (!trip){
    btn.textContent = "Gak ketemu di data";
    btn.disabled = true;
    return;
  }
  if (!trip._fbKey){
    // Mode mock data (belum login/live) — gak ada record Firebase asli buat
    // ditulisin, jadi tombolnya sengaja dimatiin biar gak nyasar/gagal diam-diam.
    btn.textContent = "Mode contoh";
    btn.disabled = true;
    return;
  }
  if (!window.firebase || !firebase.apps || !firebase.apps.length || !firebase.auth || !firebase.auth().currentUser){
    btn.textContent = "Belum login";
    return;
  }
  btn.disabled = true;
  btn.textContent = "Nyimpen...";
  const nowIso = new Date().toISOString();
  firebase.database().ref(LH_PATH + "/" + trip._fbKey).update({ ataDest: nowIso })
    .then(() => {
      btn.textContent = "✓ Tiba";
      // Sync ulang currentTrips dari Firebase biar status/badge di dashboard
      // DAN konteks JSON yang bakal dikirim ke AI di pertanyaan berikutnya
      // ikut ke-update (gak nyisain data basi di memori browser).
      loadData();
    })
    .catch(err => {
      console.error(err);
      btn.textContent = "Gagal, klik lagi";
      btn.disabled = false;
    });
}

// ===== Micro-Charts di dalam Chat — dipanggil dari addMessage() kalau AI =====
// nyertain field "chart" di JSON balasannya (lihat instruksi di jsonFormatRule).
const CHART_COLORS = ["#E8A33D","#4FD1C5","#E4604D","#8B93A1","#6C8EF5","#C77DFF","#63D471","#F27DB0"];
function renderChart(canvas, spec){
  if (typeof Chart === "undefined"){
    console.warn("Chart.js belum ke-load, skip render chart.");
    return;
  }
  const type = (spec.type === "bar" || spec.type === "line") ? spec.type : "pie";
  const isCategorical = (type === "pie");
  try{
    new Chart(canvas.getContext("2d"), {
      type: type,
      data: {
        labels: spec.labels || [],
        datasets: [{
          label: spec.title || "",
          data: spec.data || [],
          backgroundColor: isCategorical ? CHART_COLORS : CHART_COLORS[0],
          borderColor: type === "line" ? CHART_COLORS[1] : "transparent",
          borderWidth: type === "line" ? 2 : 0,
          tension: type === "line" ? .3 : 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: isCategorical, labels: { color: "#8B93A1", font: { size: 11 } } },
          title: { display: !!spec.title, text: spec.title || "", color: "#E7EAEE", font: { size: 12 } }
        },
        scales: isCategorical ? {} : {
          x: { ticks: { color: "#8B93A1" }, grid: { color: "#2B3341" } },
          y: { ticks: { color: "#8B93A1" }, grid: { color: "#2B3341" }, beginAtZero: true }
        }
      }
    });
  }catch(e){
    console.warn("Gagal render chart:", e.message);
  }
}

function addMessage(role, text, attachUnits, imageDataUrls, chartSpec){
  const log = document.getElementById("chatLog");
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role==="user" ? "user" : "agent");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role==="user" ? "Lo" : "Odyssey";
  wrap.appendChild(who);
  // imageDataUrls bisa array (multi-image) ATAU string tunggal (kompatibel sama
  // pemanggilan lama) — dinormalisasi jadi array di sini.
  const images = Array.isArray(imageDataUrls) ? imageDataUrls : (imageDataUrls ? [imageDataUrls] : []);
  images.forEach(url => {
    const img = document.createElement("img");
    img.className = "msg-image";
    img.src = url;
    img.alt = "gambar terlampir";
    img.addEventListener("click", () => window.open(url, "_blank"));
    wrap.appendChild(img);
  });
  if (text && text.trim()){
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
  }
  if (attachUnits && attachUnits.length){
    const card = document.createElement("div");
    card.innerHTML = renderAttachCard(attachUnits);
    wrap.appendChild(card);
    // innerHTML gak nge-attach event listener otomatis, jadi di-wire manual
    // abis elemen-elemennya bener-bener ada di DOM.
    card.querySelectorAll(".set-arrived-btn").forEach(btn => {
      btn.addEventListener("click", () => handleSetArrivedClick(btn));
    });
  }
  if (chartSpec && Array.isArray(chartSpec.data) && chartSpec.data.length){
    const chartBox = document.createElement("div");
    chartBox.className = "chart-wrap";
    const canvas = document.createElement("canvas");
    chartBox.appendChild(canvas);
    wrap.appendChild(chartBox);
    renderChart(canvas, chartSpec);
  }
  if (role !== "user" && text && text.trim()){
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-btn";
    copyBtn.type = "button";
    copyBtn.textContent = "📋 Copy";
    copyBtn.addEventListener("click", () => {
      const finish = () => {
        copyBtn.textContent = "✓ Tersalin";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "📋 Copy";
          copyBtn.classList.remove("copied");
        }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(finish).catch(() => {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          finish();
        });
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        finish();
      }
    });
    wrap.appendChild(copyBtn);
  }
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

// Ubah pesan error teknis dari API jadi kalimat simpel yang enak dibaca user
// biasa, bukan mentahan pesan Gemini/HTTP yang penuh istilah teknis.
function simplifyErrorMessage(raw){
  const msg = String(raw || "");

  // Kena limit pemakaian (rate limit / quota harian free tier Gemini, dll)
  if (/rate.?limit/i.test(msg) || /RESOURCE_EXHAUSTED/i.test(msg) || /quota/i.test(msg)){
    // Kalau Gemini kasih tau berapa detik lagi harus nunggu (retryDelay/"try again
    // in 12.3s"), hitung jadi jam WIB yang konkret. Kalau gak ada info itu, kasih
    // estimasi umum.
    const waitMatch = msg.match(/try again in\s*([\d.]+)\s*s/i) || msg.match(/"retryDelay"\s*:\s*"([\d.]+)s"/i);
    if (waitMatch){
      const waitSeconds = parseFloat(waitMatch[1]);
      const retryAt = new Date(Date.now() + waitSeconds * 1000);
      const hh = String(retryAt.getHours()).padStart(2,"0");
      const mm = String(retryAt.getMinutes()).padStart(2,"0");
      return `Anda telah melebihi limit penggunaan AI Agent bro (SEMUA model cadangan juga udah abis jatahnya). Mohon gunakan kembali pada jam ${hh}:${mm} WIB ya.`;
    }
    return "Anda telah melebihi limit penggunaan AI Agent bro (SEMUA model cadangan juga udah abis jatahnya). Mohon tunggu sekitar 1 menit lalu coba lagi ya.";
  }

  // Model gak ketemu/gak bisa diakses, atau kena filter safety Gemini
  if (/does not exist|do not have access|not found|NOT_FOUND/i.test(msg)){
    return "Waduh, model AI-nya lagi bermasalah di sisi server bro. Coba lagi sebentar, atau kabarin admin kalau masih error terus.";
  }
  if (/SAFETY|blockReason|PROHIBITED_CONTENT/i.test(msg)){
    return "Waduh, jawabannya keblokir filter safety AI bro. Coba tulis ulang pertanyaannya dengan cara lain ya.";
  }

  // Server function belum ke-deploy / respons bukan JSON
  if (/non-JSON|Server balikin respons/i.test(msg)){
    return "Waduh, server AI Agent-nya lagi gak bisa dihubungin bro. Coba refresh & tanya lagi sebentar ya.";
  }

  // Fallback umum — gak nampilin detail teknis mentah ke user
  return "Waduh, gagal ngambil jawaban AI bro. Coba tanya ulang sebentar lagi ya.";
}

Format WAJIB buat semua jam/tanggal yang kamu tulis (STA, ETA, waktu berangkat/tiba, dll):
tulis dalam format "DD/MM HH:mm WIB" yang gampang dibaca manusia (contoh: "05/09 07:30 WIB"), AMBIL DARI
JAM LOKAL field ISO yang ada (abaikan huruf "T" dan "Z" serta angka detik/milidetik-nya, itu cuma format
teknis, JANGAN pernah ditulis mentah-mentah ke user).

TEMPLATE WAJIB kalau user minta "Report" / "Laporan" Late Arrival dan/atau Early Arrival (ikuti PERSIS,
teks polos TANPA tanda bintang atau simbol markdown apa pun, tiap baris di bawah = 1 item terpisah di
array "replyLines"):

Late/Early Arrival Issue's
(tulis tanggal yang relevan di sini, format DD/MM/YYYY)
<baris kosong>
1. LT Number : (isi tripNum)
   Vendor : (isi vendorName)
   Driver : (isi driver)
   Qty Parcel : (isi qtyParcelVal)
   STA : (isi staDest, format jam di atas)
   ATA : (isi ataDest, format jam di atas — kalau belum ada tulis "-")
   Travel Time : (isi durasi tempuh, format "Xh Ym")
<baris kosong>
2. LT Number : ...dst, angka urut lanjut buat tiap trip berikutnya, dengan struktur field yang SAMA PERSIS.

Kalau user minta gabungan Late Arrival DAN Early Arrival, urutin Late Arrival dulu semua baru Early
Arrived, atau kalau user cuma minta salah satu ya isi yang diminta aja. Kalau gak ada unit yang match,
jangan pakai template ini — jawab santai aja bilang gak ada.

Data trip tercatat, total ${currentTrips.length} trip, dengan ${lateCount} di antaranya berstatus
"Late Arrival" (JSON):
${JSON.stringify(tripsForPrompt, null, 2)}

${jsonFormatRule}

Contoh buat jawaban singkat 1 baris, "replyLines" tetap array isi 1 item, misal: {"replyLines": ["Gak ada unit Late Arrival hari ini bro."], "attachedUnits": []}`;
  }

  // Gemini pakai format "contents": array {role:"user"|"model", parts:[...]}
  // (BUKAN "assistant" kayak OpenAI/Groq — Gemini pakai "model"). Tiap part
  // bisa {text:"..."} biasa, atau {inline_data:{mime_type, data}} buat gambar
  // (base64 TANPA prefix "data:image/...;base64,", makanya di-strip di bawah).
  // Batasin cuma N pesan TERAKHIR yang dikirim ulang ke API (bukan seluruh riwayat
  // dari awal sesi) — biar prompt gak numpuk makin panjang makin berat tiap turn,
  // yang bikin token per-request membengkak & gampang kena limit di percakapan panjang.
  const HISTORY_LIMIT = 12;
  const recentHistory = chatHistory.slice(-HISTORY_LIMIT);
  function toGeminiParts(content){
    if (Array.isArray(content)){
      return content.map(part => {
        if (part && part.type === "image_url"){
          const url = (part.image_url && part.image_url.url) || "";
          const match = url.match(/^data:([^;]+);base64,(.+)$/);
          return match
            ? { inline_data: { mime_type: match[1], data: match[2] } }
            : { text: "" };
        }
        return { text: String((part && part.text) || "") };
      });
    }
    return [{ text: String(content || "") }];
  }
  const contentsForApi = recentHistory.map(m => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: toGeminiParts(m.content)
  }));

  try{
    // Panggil lewat Netlify Function proxy (bukan langsung ke Gemini) supaya
    // API key gak pernah ke-expose di browser. Lihat netlify/functions/gemini-proxy.js
    // Model (termasuk dukungan vision buat gambar) udah ditentuin di sisi proxy
    // (constant GEMINI_MODEL) — model Gemini flash-nya udah multimodal jadi gak
    // perlu ganti model/parameter khusus kalau ada gambar terlampir.
    const requestBody = {
      // Mode DW report sekarang bisa ngeluarin BANYAK blok SHIFT (gak dibatesin 3-4 lagi,
      // bisa 9+ tergantung gambar) — jatah token-nya WAJIB lebih gede dari mode data biasa,
      // biar jawabannya gak kepotong di tengah JSON (yang bikin parse gagal & muncul pesan
      // "format balasan AI-nya berantakan").
      max_tokens: isDwReport ? 6000 : (isDataQuery ? 3000 : 1500),
      // Level thinking: mode data (trip JSON / DW report) butuh AI teliti nyisir
      // data satu-satu DAN gak kebawa topik riwayat obrolan sebelumnya (misal abis
      // ditanya report DW, terus ditanya Late Arrival trip — pernah kejadian
      // AI ke-distract & jawabannya asal gara-gara "minimal" kekurangan mikir).
      // Obrolan santai tetep "minimal" biar hemat token/latency.
      thinking_level: isDataQuery ? "low" : "minimal",
      // Toggle "Model" di topbar — kalau user pilih model spesifik (bukan
      // "Auto"), ini dikirim ke proxy buat dicoba PALING DEPAN (fallback ke
      // sisa daftar tetep jalan kalau model pilihan itu kena limit).
      preferred_model: document.getElementById("modelSelect").value || undefined,
      system: systemPrompt,
      contents: contentsForApi
    };
    const response = await fetch("/.netlify/functions/gemini-proxy", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(requestBody)
    });
    const rawText = await response.text();
    let data;
    try{
      data = rawText ? JSON.parse(rawText) : {};
    }catch(e){
      throw new Error("Server balikin respons non-JSON (kemungkinan function belum ke-deploy atau crash). Cuplikan: " + rawText.slice(0,150));
    }
    if (!response.ok){
      throw new Error((data && data.error && data.error.message) ? data.error.message : ((data && data.error) ? data.error : ("HTTP " + response.status + " (respons kosong)")));
    }
    // Gemini balikin "candidates" (bukan "choices" kayak OpenAI/Groq). Kalau
    // jawaban keblokir safety filter, candidates bisa kosong & alasannya ada
    // di promptFeedback.blockReason.
    const candidate = (data.candidates && data.candidates[0]) || null;
    if (!candidate && data.promptFeedback && data.promptFeedback.blockReason){
      throw new Error("blockReason: " + data.promptFeedback.blockReason);
    }
    // Kasih tau di status line model MANA yang beneran ngejawab — kalau toggle
    // di-set ke model tertentu tapi ternyata itu kena limit, proxy otomatis
    // fallback ke model lain, jadi ini bisa beda dari pilihan di dropdown.
    if (data._modelUsed){
      const label = MODEL_LABELS[data._modelUsed] || data._modelUsed;
      const base = document.getElementById("statusLine").textContent.split(" · model:")[0];
      document.getElementById("statusLine").textContent = base + " · model: " + label;
    }
    const partsText = candidate && candidate.content && Array.isArray(candidate.content.parts)
      ? candidate.content.parts.map(p => (p && p.text) || "").join("")
      : "";
    let text = partsText.trim();
    // Bersihin code fence di mana pun posisinya (bukan cuma di awal/akhir persis)
    text = text.replace(/```json/gi, "").replace(/```/g, "").trim();

    // Ambil substring dari kurung kurawal PERTAMA sampai kurung kurawal
    // TERAKHIR — jadi kalau AI masih nyelipin kalimat pembuka/penutup di luar
    // JSON (padahal udah dilarang), itu gak bikin JSON.parse langsung gagal.
    const firstBrace = text.indexOf("{");
    const lastBrace = text.lastIndexOf("}");
    if (firstBrace !== -1 && lastBrace > firstBrace){
      text = text.slice(firstBrace, lastBrace + 1);
    }

    // Coba parse langsung dulu. Kalau AI-nya (Gemini) masih ngasal — misal nulis
    // enter/tab literal, over-escape jadi "\\n" dobel, pakai tanda kutip
    // "pintar" (smart quotes), atau nyisain trailing comma — di dalam string
    // JSON, JSON.parse bisa gagal atau kebaca aneh. Sebelumnya ini bikin
    // mentahan JSON ke-tampil ke chat. Sekarang kalau parse pertama gagal,
    // coba beberapa cara perbaikan berurutan sebelum nyerah ke fallback.
    let parsed;
    let ok = false;
    const attempts = [
      text,
      text.replace(/\r\n|\r|\n/g, "\\n").replace(/\t/g, "\\t"), // newline/tab literal -> escaped
      text.replace(/\\\\n/g, "\\n").replace(/\\\\t/g, "\\t"),    // over-escaped \\n -> \n
      text.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"'), // smart quotes -> lurus
      text.replace(/,\s*([\]}])/g, "$1")                         // hapus trailing comma sebelum ] / }
    ];
    for (const candidate of attempts){
      try{ parsed = JSON.parse(candidate); ok = true; break; }
      catch(e){ /* coba kandidat berikutnya */ }
    }

    // Last resort kalau SEMUA percobaan JSON.parse tetep gagal: jangan lempar
    // mentahan JSON ke chat kayak sebelumnya — tarik isi array "replyLines"
    // pakai regex biar user tetap dapet teks yang bisa dibaca manusia.
    if (!ok){
      const linesMatch = text.match(/"replyLines"\s*:\s*\[([\s\S]*?)\]\s*,\s*"attachedUnits"/);
      if (linesMatch){
        const items = [];
        const itemRegex = /"((?:[^"\\]|\\.)*)"/g;
        let m;
        while ((m = itemRegex.exec(linesMatch[1])) !== null){
          items.push(m[1].replace(/\\n/g, "\n").replace(/\\"/g, '"'));
        }
        if (items.length){ parsed = { replyLines: items, attachedUnits: [] }; ok = true; }
      }
    }
    if (!ok) parsed = { replyLines: ["Waduh, format balasan AI-nya berantakan bro, coba tanya ulang sekali lagi ya."], attachedUnits: [] };

    // Susun teks final dari array replyLines (baris baru beneran, bukan hasil
    // escape dari AI) — kalau AI masih pakai format lama "reply" (string biasa),
    // tetap didukung biar gak putus kompatibilitas.
    let replyText = "...";
    if (Array.isArray(parsed.replyLines)){
      replyText = parsed.replyLines.map(l => String(l)).join("\n");
    } else if (typeof parsed.reply === "string"){
      replyText = parsed.reply;
    }
    // Field "chart" opsional (lihat jsonFormatRule) — divalidasi dulu biar gak
    // nyoba render Chart.js dengan data yang gak lengkap/rusak.
    const chartSpec = (parsed.chart && Array.isArray(parsed.chart.data) && Array.isArray(parsed.chart.labels)
      && parsed.chart.data.length && parsed.chart.data.length === parsed.chart.labels.length)
      ? parsed.chart : null;

    removeTyping();
    addMessage("agent", replyText, parsed.attachedUnits, null, chartSpec);
    chatHistory.push({role:"assistant", content: replyText});
    saveChatHistory();
  }catch(e){
    console.error(e);
    removeTyping();
    addMessage("agent", simplifyErrorMessage(e.message));
  }
}

document.getElementById("refreshBtn").addEventListener("click", loadData);

// ===== Attach gambar via paste (Ctrl+V), drag-and-drop, ATAU beberapa gambar =====
// sekaligus (bukan cuma 1 kayak sebelumnya). pendingImages sekarang ARRAY.
let pendingImages = [];
const MAX_PENDING_IMAGES = 6; // batas wajar biar payload ke proxy gak kegedean

function renderPendingImages(){
  const row = document.getElementById("imgPreviewRow");
  const list = document.getElementById("thumbList");
  list.innerHTML = "";
  pendingImages.forEach((dataUrl, idx) => {
    const thumbWrap = document.createElement("div");
    thumbWrap.className = "thumb-wrap";
    const img = document.createElement("img");
    img.src = dataUrl;
    img.alt = "preview";
    const removeBtn = document.createElement("button");
    removeBtn.className = "remove-img";
    removeBtn.type = "button";
    removeBtn.title = "Hapus gambar";
    removeBtn.textContent = "✕";
    removeBtn.addEventListener("click", () => {
      pendingImages.splice(idx, 1);
      renderPendingImages();
    });
    thumbWrap.appendChild(img);
    thumbWrap.appendChild(removeBtn);
    list.appendChild(thumbWrap);
  });
  row.classList.toggle("show", pendingImages.length > 0);
}
function addPendingImage(dataUrl){
  if (pendingImages.length >= MAX_PENDING_IMAGES) return;
  pendingImages.push(dataUrl);
  renderPendingImages();
}
function clearPendingImages(){
  pendingImages = [];
  renderPendingImages();
}
// Terima FileList (dari drop ATAU dari input file) dan tambahin tiap file
// bertipe gambar ke antrian pendingImages.
function addImageFiles(fileList){
  Array.from(fileList || []).forEach(file => {
    if (!file || !file.type || file.type.indexOf("image") === -1) return;
    const reader = new FileReader();
    reader.onload = (ev) => addPendingImage(ev.target.result);
    reader.readAsDataURL(file);
  });
}
function handlePasteEvent(e){
  const items = (e.clipboardData || e.originalEvent && e.originalEvent.clipboardData || {}).items;
  if (!items) return;
  let pastedAny = false;
  for (const item of items){
    if (item.type && item.type.indexOf("image") !== -1){
      const file = item.getAsFile();
      if (!file) continue;
      const reader = new FileReader();
      reader.onload = (ev) => addPendingImage(ev.target.result);
      reader.readAsDataURL(file);
      pastedAny = true;
    }
  }
  if (pastedAny) e.preventDefault();
}
document.getElementById("chatInput").addEventListener("paste", handlePasteEvent);

// ===== Drag-and-drop file gambar dari file explorer ke seluruh chat panel =====
const chatPanelEl = document.querySelector(".chat-panel");
let dragDepth = 0; // hitung enter/leave biar highlight gak kedip pas drag di atas elemen anak
chatPanelEl.addEventListener("dragenter", (e) => {
  e.preventDefault();
  dragDepth++;
  chatPanelEl.classList.add("drag-over");
});
chatPanelEl.addEventListener("dragover", (e) => {
  e.preventDefault(); // wajib, biar event "drop" kepanggil
});
chatPanelEl.addEventListener("dragleave", (e) => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) chatPanelEl.classList.remove("drag-over");
});
chatPanelEl.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  chatPanelEl.classList.remove("drag-over");
  const files = e.dataTransfer && e.dataTransfer.files;
  if (files && files.length) addImageFiles(files);
});

// ===== Quick Action Chips — klik langsung isi input & kirim =====
document.querySelectorAll("#chipRow .chip").forEach(btn => {
  btn.addEventListener("click", () => {
    const prompt = btn.dataset.prompt || btn.textContent;
    document.getElementById("chatInput").value = prompt;
    document.getElementById("sendBtn").click();
  });
});

document.getElementById("sendBtn").addEventListener("click", () => {
  const input = document.getElementById("chatInput");
  const q = input.value.trim();
  if (!q && !pendingImages.length) return; // minimal harus ada teks ATAU gambar
  input.value = "";
  const imgs = pendingImages.slice();
  clearPendingImages();
  askAgent(q, imgs);
});
document.getElementById("chatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("sendBtn").click();
});

// Sama kayak inbound.html: baru mulai sync Firebase SETELAH status login kevalidasi.
// Begitu status login berubah (mis. auth-guard.js baru selesai validasi setelah
// halaman ke-render), langsung auto-reload data dari live Firebase.
if (window.firebase && firebase.auth){
  try{
    firebase.auth().onAuthStateChanged(function(user){
      const wasReady = firebaseReady;
      firebaseReady = !!user;
      if (firebaseReady && !wasReady) loadData();
    });
  }catch(e){ console.warn("Firebase auth belum siap:", e.message); }
}

// ===== Persistent Chat Session (Anti-Hilang) =====
// Nyimpen chatHistory ke localStorage BROWSER INI tiap ada pesan baru, biar
// kalau tab ke-refresh/ke-tutup gak sengaja pas lagi nyusun report, obrolannya
// gak ilang. CATATAN: ini cuma lokal per-browser/device (bukan sync lewat
// Firebase) — ganti browser/device ya obrolan lama emang gak ikut kebawa.
const CHAT_STORAGE_KEY = "odysseyChatHistory_v1";
const CHAT_STORAGE_MAX_MESSAGES = 40; // batasin biar localStorage (~5-10MB) gak gampang penuh

// Gambar base64 di content vision-message bisa ratusan KB per gambar — kalau
// disimpen mentah-mentah ke localStorage gampang banget kena "quota exceeded"
// abis beberapa kali attach gambar. Jadi pas SIMPAN, part gambar diganti
// placeholder teks (gambar aslinya emang udah gak kepake lagi abis di-refresh,
// yang penting jejak percakapannya masih kebaca).
function sanitizeContentForStorage(content){
  if (!Array.isArray(content)) return content;
  return content.map(part => (part && part.type === "image_url")
    ? { type:"text", text:"[gambar terlampir — gak ke-simpen ulang abis refresh]" }
    : part);
}
function saveChatHistory(){
  try{
    const trimmed = chatHistory.slice(-CHAT_STORAGE_MAX_MESSAGES);
    const sanitized = trimmed.map(m => ({ role:m.role, content: sanitizeContentForStorage(m.content) }));
    localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(sanitized));
  }catch(e){
    console.warn("Gagal nyimpen riwayat chat ke localStorage:", e.message);
  }
}
// content chatHistory bisa string biasa ATAU array part vision (text+image) —
// dua-duanya diratain jadi teks polos buat ditampilin ulang di bubble.
function contentToDisplayText(content){
  if (typeof content === "string") return content;
  if (Array.isArray(content)) return content.map(p => (p && p.type === "text") ? p.text : "").join(" ").trim();
  return "";
}
// Return true kalau ada riwayat yang berhasil di-restore & di-render.
function restoreChatHistory(){
  let saved = null;
  try{
    const raw = localStorage.getItem(CHAT_STORAGE_KEY);
    saved = raw ? JSON.parse(raw) : null;
  }catch(e){
    console.warn("Gagal baca riwayat chat dari localStorage:", e.message);
  }
  if (!saved || !Array.isArray(saved) || !saved.length) return false;
  chatHistory = saved;
  saved.forEach(m => addMessage(m.role === "assistant" ? "agent" : "user", contentToDisplayText(m.content)));
  return true;
}
function clearChatHistory(){
  chatHistory = [];
  try{ localStorage.removeItem(CHAT_STORAGE_KEY); }catch(e){ /* abaikan */ }
  document.getElementById("chatLog").innerHTML = "";
  addMessage("agent", "Riwayat obrolan di-reset bro, mulai dari sini ya.");
}
document.getElementById("clearChatBtn").addEventListener("click", clearChatHistory);

(async function init(){
  const hadHistory = restoreChatHistory();
  await loadData();
  // Sapaan pembuka cuma muncul kalau ini SESI BARU (belum ada riwayat
  // ke-restore) — biar gak dobel nongol tiap kali halaman di-refresh.
  if (!hadHistory){
    addMessage("agent", "Halo, gua Odyssey AI Agent buat mantau Seluruh operasional & Daily Reporting Palangka Raya DC\"");
  }
})();
</script>
